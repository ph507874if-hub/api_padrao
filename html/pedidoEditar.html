<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <title>Editar Pedido</title>
</head>
<body>

    <div class="container mt-4">
        <h1>Editar Pedido</h1>

        <form id="formEditarPedido">
            <div class="mb-3">
                <label for="id" class="form-label">ID do Pedido</label>
                <input type="text" class="form-control" id="id" readonly>
            </div>

            <div class="mb-3">
                <label for="usuario_id" class="form-label">Usuário</label>
                <select class="form-control" id="usuario_id" required>
                    <option value="">Carregando usuários...</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="produto_id" class="form-label">Produto</label>
                <select class="form-control" id="produto_id" required>
                    <option value="">Carregando produtos...</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="quantidade" class="form-label">Quantidade</label>
                <input type="number" class="form-control" id="quantidade" min="1" required>
            </div>

            <button type="submit" class="btn btn-primary">Salvar Alterações</button>
            <a href="pedidos.html" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>

    <script src="pedidoEditar.js"></script>
</body>
</html>
