<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <title>Editar Usuário</title>
</head>
<body>

    <div class="container mt-4">
        <h1>Editar Usuário</h1>

        <form id="formEditar">
            <div class="mb-3">
                <label for="id" class="form-label">ID</label>
                <input type="text" class="form-control" id="id" readonly>
            </div>

            <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>

            <div class="mb-3">
                <label for="idade" class="form-label">Idade</label>
                <input type="number" class="form-control" id="idade" required>
            </div>

            <div class="mb-3">
                <label for="altura" class="form-label">Altura</label>
                <input type="number" step="0.01" class="form-control" id="altura" required>
            </div>

            <button type="submit" class="btn btn-primary">Salvar Alterações</button>
            <a href="usuarios.html" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>

    <script src="usuarioEdita.js"></script>
</body>
</html>
