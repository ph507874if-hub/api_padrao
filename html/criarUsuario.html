<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar Usuário</title>

</head>
<body>

    <div class="container mt-4">

        <h1>Criar usuario</h1>

        <form id="form-usuario">

            <div class="form-group">

                <label for="usuario_nome">Nome</label>
                <input type="text" class="form-control" id="usuario_nome"
                placeholder="Digite um nome..." required>

                <label for="usuario_email">Email</label>
                <input type="email" class="form-control" id="usuario_email"
                placeholder="Digite um email..." required>

                <label for="usuario_idade">Idade</label>
                <input type="number" class="form-control" id="usuario_idade"
                placeholder="Digite uma idade..." required>

                <label for="usuario_altura">Altura</label>
                <input type="text" class="form-control" id="usuario_altura"
                placeholder="Digite uma altura..." required>

            </div>

            <button type="button" class="btn btn-primary mt-3"
            onclick="criarUsuario()">Cadastrar</button>

        </form>

    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>

    <script src="criarUsuario.js"></script>

</body>
</html>
