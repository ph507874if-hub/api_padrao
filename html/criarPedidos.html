<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar Pedido</title>

</head>

<body>

    <div class="container mt-4">

        <h1>Criar pedido</h1>

        <form id="form-pedido">

            <div class="form-group">

                <label for="pedido_usuario">ID do usuário</label>
                <input type="number" class="form-control" id="pedido_usuario"
                placeholder="Digite o ID do usuário..." required>

                <label for="pedido_produto">ID do produto</label>
                <input type="number" class="form-control" id="pedido_produto"
                placeholder="Digite o ID do produto..." required>

                <label for="pedido_quantidade">Quantidade</label>
                <input type="number" class="form-control" id="pedido_quantidade"
                placeholder="Digite a quantidade..." required>

            </div>

            <button type="button" class="btn btn-primary mt-3"
            onclick="criarPedido()">
                Cadastrar
            </button>

        </form>

    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>

    <script src="criarPedido.js"></script>

</body>

</html>
